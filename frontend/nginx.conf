server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # La interfaz llama a /api/...; nginx lo reenvía al backend quitando el prefijo.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;   # la ingesta de PDFs grandes genera muchos embeddings
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
